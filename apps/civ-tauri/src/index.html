<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CIV Desktop: JPKI Tool</title>
  <style>
    :root {
      --primary: #0f172a;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --accent: #3b82f6;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      user-select: none;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0 0 8px 0;
      color: var(--primary);
    }

    .subtitle {
      font-size: 0.9rem;
      color: #64748b;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #475569;
    }

    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 1.1rem;
      letter-spacing: 0.1em;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="password"]:focus,
    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    button {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #2563eb;
    }

    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .result {
      margin-top: 24px;
      display: none;
      border-top: 1px solid #e2e8f0;
      padding-top: 20px;
    }

    .photo-container {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .photo-container img {
      width: 120px;
      height: 160px;
      object-fit: cover;
      border-radius: 8px;
      background: #e2e8f0;
      border: 1px solid #cbd5e1;
    }

    .row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 0.95rem;
    }

    .label {
      color: #64748b;
    }

    .value {
      font-weight: 600;
      text-align: right;
    }

    .error-msg {
      color: #ef4444;
      margin-top: 16px;
      font-size: 0.9rem;
      display: none;
      background: #fef2f2;
      padding: 12px;
      border-radius: 8px;
    }

    .loading {
      margin-top: 16px;
      color: var(--accent);
      font-size: 0.9rem;
      text-align: center;
      display: none;
    }

    .dev-tools {
      margin-top: 40px;
      border-top: 2px dashed #e2e8f0;
      padding-top: 20px;
    }

    .dev-tools h2 {
      font-size: 1.1rem;
      color: #64748b;
      margin-bottom: 12px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>CIV Desktop</h1>
    <p class="subtitle">My Number Card Reader (Native)</p>

    <div class="form-group">
      <label for="pin">PIN (Auth: 4 digits)</label>
      <input type="password" id="pin" maxlength="4" placeholder="••••" autofocus>
    </div>

    <button id="read-btn">Read Card</button>

    <div id="loading" class="loading">Reading from IC Card... Please wait.</div>
    <div id="error" class="error-msg"></div>

    <div id="result" class="result">
      <div class="photo-container">
        <img id="r-photo" alt="顔写真">
      </div>
      <div class="row">
        <span class="label">Name</span>
        <span class="value" id="r-name"></span>
      </div>
      <div class="row">
        <span class="label">Address</span>
        <span class="value" id="r-address"></span>
      </div>
      <div class="row">
        <span class="label">Birth Date</span>
        <span class="value" id="r-dob"></span>
      </div>
      <div class="row">
        <span class="label">Gender</span>
        <span class="value" id="r-gender"></span>
      </div>
    </div>

    <div class="dev-tools">
      <h2>Developer Tools</h2>

      <div class="form-group">
        <label>PIN Status (Input Support)</label>
        <button id="check-pin-btn" style="background:#64748b;">Check Remaining Retries</button>
        <div id="pin-status-result" style="margin-top:8px; font-weight:bold; color:#0f172a;"></div>
      </div>

      <div class="form-group">
        <label>Dump EF (Hex ID)</label>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="ef-id-input" placeholder="e.g. 0005" style="flex:1;">
          <button id="dump-ef-btn" style="width: auto; background:#64748b; white-space:nowrap;">Dump</button>
        </div>
      </div>
      <textarea id="dump-result" rows="4"
        style="width:100%; font-family:monospace; font-size:0.8rem; border:1px solid #cbd5e1; border-radius:8px; padding:8px; box-sizing:border-box; resize:vertical;"
        readonly placeholder="EF Dump Result..."></textarea>
    </div>
  </div>

  <script>
    const { invoke } = window.__TAURI__.core;

    // Main elements
    const pinInput = document.getElementById('pin');
    const readBtn = document.getElementById('read-btn');
    const errorDiv = document.getElementById('error');
    const resultDiv = document.getElementById('result');
    const loadingDiv = document.getElementById('loading');

    // Dev Tools Elements
    const checkPinBtn = document.getElementById('check-pin-btn');
    const dumpEfBtn = document.getElementById('dump-ef-btn');
    const efIdInput = document.getElementById('ef-id-input');
    const pinStatusResult = document.getElementById('pin-status-result');
    const dumpResult = document.getElementById('dump-result');

    readBtn.addEventListener('click', async () => {
      const pin = pinInput.value;
      if (pin.length !== 4) {
        showError("Please enter a 4-digit PIN.");
        return;
      }

      setLoading(true);
      hideError();
      resultDiv.style.display = 'none';

      try {
        // Call Rust Command
        const info = await invoke('read_jpki_attributes', { pin });

        document.getElementById('r-name').textContent = info.name;
        document.getElementById('r-address').textContent = info.address;
        document.getElementById('r-dob').textContent = info.birth_date;
        document.getElementById('r-gender').textContent = info.gender;

        if (info.face_photo) {
          document.getElementById('r-photo').src = `data:image/png;base64,${info.face_photo}`;
          document.getElementById('r-photo').style.display = 'block';
        } else {
          document.getElementById('r-photo').style.display = 'none';
        }

        resultDiv.style.display = 'block';
      } catch (err) {
        console.error(err);
        showError(err);
      } finally {
        setLoading(false);
      }
    });

    checkPinBtn.addEventListener('click', async () => {
      try {
        pinStatusResult.textContent = "Checking...";
        const status = await invoke('check_pin_status');
        pinStatusResult.textContent = status;
      } catch (e) {
        pinStatusResult.textContent = "Error: " + e;
      }
    });

    dumpEfBtn.addEventListener('click', async () => {
      const efId = efIdInput.value.replace(/\s+/g, '');
      if (efId.length !== 4) {
        alert("EF ID must be 4 hex chars (e.g. 0005)");
        return;
      }
      try {
        dumpResult.value = "Reading...";
        const hexData = await invoke('debug_dump_ef', { efHex: efId });
        dumpResult.value = hexData;
      } catch (e) {
        dumpResult.value = "Error: " + e;
      }
    });

    function showError(msg) {
      errorDiv.textContent = msg;
      errorDiv.style.display = 'block';
    }

    function hideError() {
      errorDiv.style.display = 'none';
    }

    function setLoading(isLoading) {
      loadingDiv.style.display = isLoading ? 'block' : 'none';
      readBtn.disabled = isLoading;
    }
  </script>
</body>

</html>
