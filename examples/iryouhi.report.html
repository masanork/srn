<script id="weba-bootstrap">
(async () => {
  const s = document.querySelectorAll('script[type="application/x-weba-js-gz"]');
  for (const el of s) {
    const bin = atob(el.textContent.trim());
    const ui8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) ui8[i] = bin.charCodeAt(i);
    const stream = new Blob([ui8]).stream().pipeThrough(new DecompressionStream('gzip'));
    const text = await new Response(stream).text();
    const ns = document.createElement('script'); ns.textContent = text; document.body.appendChild(ns);
  }
  setTimeout(() => { if (window.initRuntime) window.initRuntime(); }, 1);
})();
</script>
