<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Folio Bank Account Opening Demo</title>
    <style>
        body { font-family: sans-serif; padding: 2rem; max-width: 800px; margin: 0 auto; }
        .card { border: 1px solid #ccc; padding: 1rem; margin-bottom: 1rem; border-radius: 8px; }
        button { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }
        input { padding: 0.5rem; font-size: 1rem; margin-right: 0.5rem; }
        #log { background: #f0f0f0; padding: 1rem; border-radius: 4px; white-space: pre-wrap; height: 300px; overflow-y: auto; }
        .error { color: red; }
        .success { color: green; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h1>🏦 Bank Account Opening</h1>
    <p>This demo uses Web/A and your My Number Card to instantly verify your identity.</p>

    <div class="card">
        <h2>Step 1: Connect Card</h2>
        <p>Please insert your My Number Card into the reader and click Connect.</p>
        <button id="connectBtn">Connect Reader</button>
    </div>

    <div id="step2" class="card hidden">
        <h2>Step 2: Authenticate</h2>
        <p>Enter your User Authentication PIN (4 digits).</p>
        <input type="password" id="pinInput" placeholder="PIN" maxlength="4">
        <button id="authBtn">Authenticate & Sign</button>
        <div id="status" style="margin-top: 1rem; font-weight: bold;"></div>
    </div>

    <div class="card">
        <h3>Logs</h3>
        <div id="log"></div>
    </div>

    <script type="module">
        import init, { WasmJpkiController, WebUsbReader } from './wasm/folio_core.js';
        import { WebUsbCcidDriver } from './ccid.js';

        let globalController = null;

        function log(msg, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            if (type === 'error') entry.className = 'error';
            if (type === 'success') entry.className = 'success';
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        document.getElementById('connectBtn').addEventListener('click', async () => {
            log("Initializing WASM...");
            await init();
            
            const driver = new WebUsbCcidDriver();
            const connected = await driver.connect();
            
            if (connected) {
                try {
                    log("Powering On Card...");
                    const atr = await driver.powerOn();
                    log(`Card Powered On. ATR: ${driver.toHex(atr)}`, 'success');

                    const reader = new WebUsbReader(driver);
                    globalController = new WasmJpkiController(reader);

                    await globalController.select_jpki_ap();
                    log("JPKI AP Selected", 'success');
                    document.getElementById('step2').classList.remove('hidden');
                    document.getElementById('connectBtn').disabled = true;
                } catch (e) {
                    log(`Init failed: ${e.message}`, 'error');
                    console.error(e);
                }
            }
        });

        document.getElementById('authBtn').addEventListener('click', async () => {

        document.getElementById('authBtn').addEventListener('click', async () => {
            const pin = document.getElementById('pinInput').value;
            if (pin.length !== 4) {
                alert("PIN must be 4 digits");
                return;
            }

            try {
                const status = document.getElementById('status');
                status.textContent = "Verifying PIN...";
                
                const efAuthPin = new Uint8Array([0x00, 0x18]);
                await globalController.verify_pin(efAuthPin, pin);
                log("PIN Verified", 'success');

                status.textContent = "Reading Certificate...";
                const cert = await globalController.read_auth_cert();
                log(`Cert Read: ${cert.length} bytes`);

                status.textContent = "Signing Challenge...";
                const challenge = new Uint8Array(32);
                crypto.getRandomValues(challenge);
                const sig = await globalController.compute_signature(challenge);
                log("Signature Created!", 'success');

                status.textContent = "✅ Identity Verified! Account Created.";
                status.style.color = "green";

            } catch (e) {
                log(`Auth failed: ${e}`, 'error');
                document.getElementById('status').textContent = "Authentication Failed";
                document.getElementById('status').style.color = "red";
            }
        });
    </script>
</body>
</html>
