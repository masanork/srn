    <script>
        (() => {
            const lang = (navigator.language || '').toLowerCase().startsWith('ja') ? 'ja' : 'en';
            if (lang === 'ja') {
                document.documentElement.lang = 'ja';
                document.documentElement.classList.add('js-lang-ja');
            } else {
                document.documentElement.lang = 'en';
                document.documentElement.classList.add('js-lang-en');
            }
            // Backward compatibility for simple data-i18n replacements
            window.addEventListener('DOMContentLoaded', () => {
                document.querySelectorAll('[data-i18n-ja]').forEach((el) => {
                    const ja = el.getAttribute('data-i18n-ja') || '';
                    const en = el.getAttribute('data-i18n-en') || ja;
                    el.textContent = lang === 'ja' ? ja : en;
                });
            });
        })();
    </script>

<body class="">
    <main>
        
        <div class="weba-report-container">

        <script id="weba-structure" type="application/json">{"@context":"https://schema.org","@type":"CreativeWork","fields":[{"key":"certificate.date","label":"証明日","type":"date"},{"key":"employer.name","label":"事業所名","type":"text"},{"key":"employer.representative","label":"代表者名","type":"text"},{"key":"employer.address","label":"所在地","type":"text"},{"key":"employer.phone","label":"電話番号","type":"text"},{"key":"employer.contact_name","label":"担当者名","type":"text"},{"key":"employer.contact_phone","label":"記載者連絡先","type":"text"},{"key":"employee.kana","label":"フリガナ","type":"text"},{"key":"employee.name","label":"本人氏名","type":"text"},{"key":"employee.birth_date","label":"生年月日","type":"date"},{"key":"employment.term","label":"雇用（予定）期間","type":"radio"},{"key":"employment.start_date","label":"雇用開始日","type":"date"},{"key":"employment.end_date","label":"雇用終了日（有期の場合）","type":"date"},{"key":"workplace.name","label":"名称","type":"text"},{"key":"workplace.address","label":"住所","type":"text"},{"key":"employment.industry","label":"業種","type":"datalist"},{"key":"employment.type","label":"雇用の形態","type":"datalist"},{"key":"variable.total_hours","label":"合計時間（時間/月）","type":"number"},{"key":"variable.unit","label":"単位","type":"radio"},{"key":"variable.work_days","label":"就労日数（日）","type":"number"},{"key":"variable.shift_time","label":"主な就労時間帯・シフト時間帯","type":"text"},{"key":"variable.break_minutes","label":"休憩時間（分）","type":"number"},{"key":"leave.maternity","label":"産前・産後休業","type":"radio"},{"key":"leave.maternity_start","label":"産前・産後開始日","type":"date"},{"key":"leave.maternity_end","label":"産前・産後終了日","type":"date"},{"key":"leave.childcare","label":"育児休業","type":"radio"},{"key":"leave.childcare_start","label":"育児休業開始日","type":"date"},{"key":"leave.childcare_end","label":"育児休業終了日","type":"date"},{"key":"leave.other","label":"産休・育休以外の休業","type":"radio"},{"key":"leave.other_reason","label":"理由","type":"radio"},{"key":"leave.other_reason_detail","label":"理由（その他）","type":"text"},{"key":"leave.other_start","label":"休業開始日","type":"date"},{"key":"leave.other_end","label":"休業終了日","type":"date"},{"key":"return.to_work","label":"復職","type":"radio"},{"key":"return.date","label":"復職（予定）年月日","type":"date"},{"key":"shorttime.use","label":"育児のための短時間勤務制度","type":"radio"},{"key":"shorttime.start","label":"期間（開始）","type":"date"},{"key":"shorttime.end","label":"期間（終了）","type":"date"},{"key":"shorttime.shift","label":"主な就労時間帯・シフト時間帯","type":"text"},{"key":"employment.nursery","label":"保育士等としての勤務実態","type":"radio"},{"key":"notes","label":"備考","type":"textarea"},{"key":"additional.tanshin","label":"就労の状況（単身赴任）","type":"radio"},{"key":"additional.tanshin_start","label":"期間（開始）","type":"date"},{"key":"additional.tanshin_end","label":"期間（終了）","type":"date"},{"key":"additional.employment_insurance","label":"雇用保険加入状況","type":"radio"},{"key":"additional.changed_work_days","label":"変更後の就労日数（週）","type":"number"},{"key":"child.name","label":"児童氏名","type":"text"},{"key":"child.birth_date","label":"生年月日","type":"date"},{"key":"child.address","label":"住所","type":"text"}],"tables":{"work_records":[{"key":"ym","label":"2025-01","type":"text"},{"key":"days","label":"days","type":"number"},{"key":"hours","label":"hours","type":"number"}]},"masterData":{"industry":[["業種"],["農業・林業"],["漁業"],["鉱業・採石業・砂利採取業"],["建設業"],["製造業"],["電気・ガス・熱供給・水道業"],["情報通信業"],["運輸業・郵便業"],["卸売業・小売業"],["金融業・保険業"],["不動産業・物品賃貸業"],["学術研究・専門・技術サービス業"],["宿泊業・飲食サービス業"],["生活関連サービス業・娯楽業"],["医療・福祉"],["教育・学習支援業"],["複合サービス事業"],["公務"],["その他"]],"employment_type":[["雇用形態"],["正社員"],["パート・アルバイト"],["派遣社員"],["契約社員"],["会計年度任用職員"],["非常勤・臨時職員"],["役員"],["自営業主"],["自営業専従者"],["家族従業者"],["内職"],["業務委託"],["その他"]]}}</script>
        <script>
            const statusEl = document.getElementById('weba-report-status');
            const fileInput = document.getElementById('weba-report-files');
            const xSelect = document.getElementById('weba-x-key');
            const ySelect = document.getElementById('weba-y-key');
            const tableHost = document.getElementById('weba-report-table');
            const canvas = document.getElementById('weba-scatter');
            const ctx = canvas.getContext('2d');

            const parseHtmlJsonLd = (htmlText) => {
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');
                let script = doc.querySelector('#data-layer');
                if (!script) script = doc.querySelector('script[type="application/ld+json"]');
                if (!script) return null;
                try { return JSON.parse(script.textContent || ''); } catch { return null; }
            };

            const flatten = (obj, prefix, out) => {
                if (!obj || typeof obj !== 'object') return;
                for (const [key, value] of Object.entries(obj)) {
                    const path = prefix ? prefix + '.' + key : key;
                    if (Array.isArray(value)) {
                        value.forEach((entry, idx) => {
                            if (entry && typeof entry === 'object') {
                                flatten(entry, path + '[' + idx + ']', out);
                            } else {
                                out[path + '[' + idx + ']'] = entry;
                            }
                        });
                    } else if (value && typeof value === 'object') {
                        flatten(value, path, out);
                    } else {
                        out[path] = value;
                    }
                }
            };

            const isNumeric = (val) => {
                if (val === null || val === undefined) return false;
                const num = typeof val === 'number' ? val : parseFloat(String(val));
                return Number.isFinite(num);
            };

            const drawScatter = (rows, xKey, yKey) => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const points = rows
                    .map(r => ({ x: r[xKey], y: r[yKey], raw: r }))
                    .filter(p => isNumeric(p.x) && isNumeric(p.y))
                    .map(p => ({ x: parseFloat(p.x), y: parseFloat(p.y) }));

                if (points.length === 0) {
                    ctx.fillStyle = '#666';
                    ctx.fillText('No numeric data for scatter plot.', 20, 30);
                    return;
                }

                const padding = 40;
                const xs = points.map(p => p.x);
                const ys = points.map(p => p.y);
                const minX = Math.min(...xs);
                const maxX = Math.max(...xs);
                const minY = Math.min(...ys);
                const maxY = Math.max(...ys);

                const scaleX = (val) => padding + ((val - minX) / (maxX - minX || 1)) * (canvas.width - padding * 2);
                const scaleY = (val) => canvas.height - padding - ((val - minY) / (maxY - minY || 1)) * (canvas.height - padding * 2);

                ctx.strokeStyle = '#ccc';
                ctx.beginPath();
                ctx.moveTo(padding, padding);
                ctx.lineTo(padding, canvas.height - padding);
                ctx.lineTo(canvas.width - padding, canvas.height - padding);
                ctx.stroke();

                ctx.fillStyle = '#1f77b4';
                points.forEach(p => {
                    ctx.beginPath();
                    ctx.arc(scaleX(p.x), scaleY(p.y), 4, 0, Math.PI * 2);
                    ctx.fill();
                });
            };

            const renderTable = (rows, keys) => {
                if (rows.length === 0) {
                    tableHost.innerHTML = '';
                    return;
                }
                const header = keys.map(k => '<th style="text-align:left;padding:6px 8px;border-bottom:1px solid #ddd;">' + k + '</th>').join('');
                const body = rows.slice(0, 50).map(r => {
                    const cells = keys.map(k => '<td style="padding:6px 8px;border-bottom:1px solid #f0f0f0;">' + (r[k] ?? '') + '</td>').join('');
                    return '<tr>' + cells + '</tr>';
                }).join('');
                tableHost.innerHTML = '<table style="border-collapse: collapse; min-width: 600px;">' +
                    '<thead><tr>' + header + '</tr></thead><tbody>' + body + '</tbody></table>';
            };

            const updateScatter = (rows) => {
                const xKey = xSelect.value;
                const yKey = ySelect.value;
                if (xKey && yKey) drawScatter(rows, xKey, yKey);
            };

            let aggregatedRows = [];
            fileInput.addEventListener('change', async () => {
                const files = Array.from(fileInput.files || []);
                aggregatedRows = [];
                statusEl.textContent = '';
                if (files.length === 0) return;

                for (const file of files) {
                    const text = await file.text();
                    const jsonLd = parseHtmlJsonLd(text);
                    if (!jsonLd) continue;
                    const flat = {};
                    flatten(jsonLd, '', flat);
                    flat['_filename'] = file.name;
                    aggregatedRows.push(flat);
                }

                if (aggregatedRows.length === 0) {
                    statusEl.textContent = 'No JSON-LD found.';
                    return;
                }

                const keys = Array.from(new Set(aggregatedRows.flatMap(r => Object.keys(r)))).sort();
                const numericKeys = keys.filter(k => aggregatedRows.some(r => isNumeric(r[k])));

                xSelect.innerHTML = numericKeys.map(k => '<option value="' + k + '">' + k + '</option>').join('');
                ySelect.innerHTML = numericKeys.map(k => '<option value="' + k + '">' + k + '</option>').join('');

                statusEl.textContent = 'Loaded ' + aggregatedRows.length + ' files.';
                renderTable(aggregatedRows, keys);
                updateScatter(aggregatedRows);
            });

            xSelect.addEventListener('change', () => updateScatter(aggregatedRows));
            ySelect.addEventListener('change', () => updateScatter(aggregatedRows));
        </script>
    
    </main>
</body>
