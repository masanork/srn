[package]
name = "folio-core"
version = "0.1.0"
edition = "2021"
description = "Core logic for Folio: JPKI interaction and Verifiable Credentials"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Dependencies now provided by jpki crate, but WasmJpkiController glue code might need some.
anyhow = "1.0"
thiserror = "1.0"
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
serde = { version = "1.0", features = ["derive"] }

# Internal Dependencies
# Internal Dependencies
civ = { path = "../civ" }

[dev-dependencies]
serde_json = "1.0"
