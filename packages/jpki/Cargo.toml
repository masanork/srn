[package]
name = "jpki"
version = "0.1.0"
edition = "2021"
description = "JPKI (Japanese Public Key Infrastructure) Card Interaction Library"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
thiserror = "1.0"
anyhow = "1.0"
async-trait = "0.1"
hex = "0.4"
base64 = "0.21"
# Crypto
rsa = "0.9"
p256 = { version = "0.13", features = ["ecdsa"] }
signature = "2.2"
x509-parser = "0.15"
zeroize = "1.7"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["std"] }
getrandom = { version = "0.2", features = ["js"] }

# WASM
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"

[dev-dependencies]
mockall = "0.11"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pcsc = "2.8"
clap = { version = "4.4", features = ["derive", "env"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
