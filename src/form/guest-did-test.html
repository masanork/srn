<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest DID Test</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin: 20px 0;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #0056b3;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 4px;
            display: none;
        }
        .result.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
        }
        .result.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <h1>Guest DID Test</h1>
    <p>Test Passkey-based Guest DID creation for anonymous form submissions with reply capability.</p>

    <form id="testForm">
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Your name" required>
        </div>

        <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" rows="4" placeholder="Your message" required></textarea>
        </div>

        <div class="form-group checkbox-group">
            <input type="checkbox" id="wantsReplies">
            <label for="wantsReplies" style="margin: 0;">Receive replies (requires Passkey)</label>
        </div>

        <button type="submit">Submit</button>
    </form>

    <div id="result" class="result"></div>

    <script src="guest-did.js"></script>
    <script>
        document.getElementById('testForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const message = document.getElementById('message').value;
            const wantsReplies = document.getElementById('wantsReplies').checked;

            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.className = 'result';
            resultDiv.textContent = 'Processing...';

            try {
                const { senderDid } = await submitFormWithGuestDid(
                    { name, message },
                    wantsReplies
                );

                resultDiv.className = 'result success';
                resultDiv.innerHTML = `
                    <strong>Success!</strong><br>
                    Sender DID: <code>${senderDid}</code><br>
                    ${wantsReplies ? 'Guest DID created with Passkey' : 'Anonymous submission (form DID)'}
                `;
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <strong>Error:</strong><br>
                    ${error.message}
                `;
            }
        });
    </script>
</body>
</html>
